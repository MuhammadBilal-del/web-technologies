<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forms | Bootstrap | CSSE3143</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <p><a href="../index.html">Course home</a></p>
    <h1>Forms</h1>
    <p>Text inputs and textareas take <code>form-control</code>. Labels take <code>form-label</code>. <code>mb-3</code> is the gap under each field. Checks use <code>form-check</code>.</p>

    <form class="col-lg-6" action="#" method="get">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" type="email" id="email" name="email" placeholder="name@ucp.edu.pk">
      </div>
      <div class="mb-3">
        <label class="form-label" for="pwd">Password</label>
        <input class="form-control" type="password" id="pwd" name="pwd" placeholder="At least 6 characters">
      </div>
      <div class="mb-3">
        <label class="form-label" for="section">Section</label>
        <select class="form-select" id="section" name="section">
          <option>Section A</option>
          <option selected>Section B</option>
          <option>Section C</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label" for="note">Note</label>
        <textarea class="form-control" id="note" name="note" rows="3"></textarea>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="remember" name="remember">
        <label class="form-check-label" for="remember">Remember this browser</label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input" type="radio" name="mode" id="lab" checked>
        <label class="form-check-label" for="lab">Lab exercise</label>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="radio" name="mode" id="project">
        <label class="form-check-label" for="project">Project</label>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    <p class="mt-4"><a href="07-navbar.html">Next: navbar</a></p>
  </div>
</body>
</html>
