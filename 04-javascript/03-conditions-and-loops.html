<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conditions and loops | JavaScript | CSSE3143</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; line-height: 1.5; max-width: 820px; margin: 24px auto; padding: 0 16px; color: #1c2430; }
    h1 { color: #16324f; font-size: 1.6rem; }
    code, pre { font-family: Consolas, "Courier New", monospace; }
    pre { background: #f4f6f8; padding: 12px; overflow-x: auto; }
    .demo { border: 1px solid #d5dbe3; background: #fff; padding: 16px; margin: 16px 0; }
    input, button { font: inherit; padding: 6px 8px; }
    footer { margin-top: 28px; color: #5c6775; font-size: 0.9rem; }
  </style>
</head>
<body>
  <p><a href="../index.html">Course home</a></p>
  <h1>if, else, switch, and loops</h1>

  <div class="demo">
    <p>
      <label for="marks">Marks (0–100)</label>
      <input id="marks" type="number" min="0" max="100" value="76">
      <button type="button" id="gradeBtn">Grade</button>
    </p>
    <p id="gradeOut">The grade will appear here.</p>
  </div>

  <div class="demo">
    <p>
      <label for="day">Day number (1–7)</label>
      <input id="day" type="number" min="1" max="7" value="1">
      <button type="button" id="dayBtn">Day name</button>
    </p>
    <p id="dayOut">Uses switch.</p>
  </div>

  <h2>Loops</h2>
  <p>Press the button. A <code>for</code> loop prints 1 to 5. A <code>while</code> loop counts down from 3.</p>
  <button type="button" id="loopBtn">Run loops</button>
  <pre id="loops"></pre>

  <footer>
    <p>Muhammad Bilal · L1F22BSCS1040 · <a href="04-functions.html">Next: functions</a></p>
  </footer>

  <script>
    function letterGrade(marks) {
      if (marks >= 90) {
        return "A";
      } else if (marks >= 80) {
        return "B";
      } else if (marks >= 70) {
        return "C";
      } else if (marks >= 60) {
        return "D";
      } else {
        return "F";
      }
    }

    document.getElementById("gradeBtn").addEventListener("click", function () {
      let marks = Number(document.getElementById("marks").value);
      document.getElementById("gradeOut").textContent = marks + " is grade " + letterGrade(marks);
    });

    document.getElementById("dayBtn").addEventListener("click", function () {
      let day = Number(document.getElementById("day").value);
      let name;
      switch (day) {
        case 1: name = "Monday"; break;
        case 2: name = "Tuesday"; break;
        case 3: name = "Wednesday"; break;
        case 4: name = "Thursday"; break;
        case 5: name = "Friday"; break;
        case 6: name = "Saturday"; break;
        case 7: name = "Sunday"; break;
        default: name = "Pick a number from 1 to 7";
      }
      document.getElementById("dayOut").textContent = name;
    });

    document.getElementById("loopBtn").addEventListener("click", function () {
      let text = "for:\n";
      for (let i = 1; i <= 5; i++) {
        text += i + " ";
      }
      text += "\n\nwhile:\n";
      let n = 3;
      while (n > 0) {
        text += n + " ";
        n = n - 1;
      }
      document.getElementById("loops").textContent = text;
    });
  </script>
</body>
</html>
